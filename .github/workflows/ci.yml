# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Security scans only: this repository is a single Cloudflare Worker source file with no
# package.json, lockfile or tests, so there is no Node job to run. Add `ci-node` once the Worker
# gets a package.json + lockfile (typecheck, tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
